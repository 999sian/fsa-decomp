name: Build

on:
  push:
    branches: [main, integration*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [G4SE01, G4SJ01, G4SP01, G4SJ01_NT]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Verify Progress Metadata & Run Regression Tests
      run: |
        python3 tools/progress.py --version ${{ matrix.version }} --test

    - name: Generate Progress Report & Summary
      run: |
        python3 tools/progress.py --version ${{ matrix.version }} --output-json build/${{ matrix.version }}_progress.json --output-shields build/${{ matrix.version }}_shields.json

    - name: Upload progress report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}_*.json
        if-no-files-found: warn

  website:
    name: website
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Download all progress reports
      uses: actions/download-artifact@v4
      with:
        path: build/artifacts/

    - name: Generate Markdown Job Summary
      run: |
        for v in G4SE01 G4SJ01 G4SP01 G4SJ01_NT; do
          if [ -f "build/artifacts/${v}_report/${v}_progress.json" ]; then
            cp "build/artifacts/${v}_report/${v}_progress.json" "build/${v}_progress.json"
          fi
          python3 tools/progress.py --version "$v" --summary
        done

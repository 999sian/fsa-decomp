name: Progress Report

on:
  push:
    branches: [main, integration*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    name: Decompilation Progress
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Verify Progress Metadata & Run Regression Tests
      run: |
        python3 tools/progress.py --test

    - name: Generate Progress Report & Summary
      run: |
        python3 tools/progress.py --summary \
          --output-json build/progress.json \
          --output-shields build/shields.json

    - name: Upload Progress Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: progress-report
        path: build/*.json
        if-no-files-found: warn
